name: Publish Windows release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: '待发布的 vX.Y.Z；手动运行仅构建验证，不创建 Release'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and verify Windows x64
    runs-on: windows-2025
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    env:
      MUSIC_SERVICE_BINARY: ${{ github.workspace }}/.desktop-build/backend-install/bin/music-service.exe
      MUSIC_SERVICE_LICENSES: ${{ github.workspace }}/.desktop-build/backend-install/share/music-service/licenses
      CMAKE_BUILD_PARALLEL_LEVEL: '3'
      RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@d9184bf108216479bc5a137cc391f4d7b14c870b # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - name: Validate tag, versions and changelog
        id: release
        run: node scripts/release.js prepare
      - name: Check out pinned music-service
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ steps.release.outputs.backend_repository }}
          ref: ${{ steps.release.outputs.backend_revision }}
          path: .desktop-build/backend
          persist-credentials: false
      - name: Build, test and install music-service with static MSVC runtime
        shell: cmd
        working-directory: .desktop-build/backend
        run: |
          for /f "usebackq delims=" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSPATH=%%i"
          call "%VSPATH%\VC\Auxiliary\Build\vcvars64.bat" || exit /b 1
          cmake --preset windows-msvc-release -DBUILD_TESTING=ON || exit /b 1
          cmake --build --preset windows-msvc-release || exit /b 1
          ctest --test-dir out/build/windows-msvc-release --output-on-failure --no-tests=error --timeout 120 --repeat until-pass:2 || exit /b 1
          cmake --install out/build/windows-msvc-release --prefix ../backend-install || exit /b 1
      - run: pnpm install --frozen-lockfile
      - run: pnpm desktop:setup
      - run: pnpm check
      - run: pnpm desktop:build
      - name: Verify Windows metadata, imports and ZIP contents
        run: ./scripts/verify-desktop.ps1 -ServiceBinary $env:MUSIC_SERVICE_BINARY
      - name: Verify embedded resources and start the real service offline
        run: node scripts/smoke-release.js
      - name: Generate checksums and build provenance
        run: node scripts/release.js stage
      - name: Save verified release assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: .desktop-build/publish/*
          include-hidden-files: true
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  publish:
    name: Publish complete GitHub Release
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: .desktop-build/publish
      - name: Verify transferred assets and notes
        run: node scripts/release.js verify
      - name: Upload all assets before making the release public
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo 'Release already exists; refusing to replace published assets.' >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" \
            .desktop-build/publish/qudai-win_x64.exe \
            .desktop-build/publish/qudai-windows-x64.zip \
            .desktop-build/publish/SHA256SUMS \
            .desktop-build/publish/release-manifest.json \
            --draft --verify-tag --title "曲袋 $RELEASE_TAG" \
            --notes-file .desktop-build/publish/release-notes.md
          gh release edit "$RELEASE_TAG" --draft=false --latest
